<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>MIDA - The Destiny 2 Multi-Tool</title>
    <link rel="stylesheet" href="compiled.css" />
    <script>
      for (const [name, pixels] of new URLSearchParams(location.search)) {
        document.documentElement.style.setProperty(`--${name}`, `${pixels}px`);
      }
    </script>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body class="flex flex-col h-screen text-md">
    <header
      class="flex items-center shrink-0 pl-4 border-b-2 border-secondary select-none"
      style="-webkit-app-region: drag"
    >
      <div class="group flex items-center" style="-webkit-app-region: no-drag">
        <img src="icon.png" alt="" class="w-5 h-5 mr-1" />
        <div class="flex items-baseline">
          <a
            onclick="mida.toggleMenu()"
            class="text-slate-100 text-shadow-lg hover:text-slate-400 hover:cursor-pointer"
          >
            MIDA
          </a>
          <span
            id="version"
            class="ml-2 text-[8px] text-slate-500 font-bold slide-out"
          ></span>
        </div>
      </div>
      <div class="flex h-full ml-auto" style="-webkit-app-region: no-drag">
        <a
          href="https://github.com/itznao/mida/"
          target="_blank"
          title="GitHub"
          class="w-8 grid place-items-center text-slate-300 hover:text-slate-400"
        >
<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github" viewBox="0 0 16 16">
  <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
</svg>
        </a>
        <a
          href="https://discord.gg/7gSFp628Sm"
          target="_blank"
          title="Discord"
          class="w-8 grid place-items-center text-slate-300 hover:text-slate-400"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-discord"
            viewBox="0 0 16 16"
          >
            <path
              d="M13.545 2.907a13.2 13.2 0 0 0-3.257-1.011.05.05 0 0 0-.052.025c-.141.25-.297.577-.406.833a12.2 12.2 0 0 0-3.658 0 8 8 0 0 0-.412-.833.05.05 0 0 0-.052-.025c-1.125.194-2.22.534-3.257 1.011a.04.04 0 0 0-.021.018C.356 6.024-.213 9.047.066 12.032q.003.022.021.037a13.3 13.3 0 0 0 3.995 2.02.05.05 0 0 0 .056-.019q.463-.63.818-1.329a.05.05 0 0 0-.01-.059l-.018-.011a9 9 0 0 1-1.248-.595.05.05 0 0 1-.02-.066l.015-.019q.127-.095.248-.195a.05.05 0 0 1 .051-.007c2.619 1.196 5.454 1.196 8.041 0a.05.05 0 0 1 .053.007q.121.1.248.195a.05.05 0 0 1-.004.085 8 8 0 0 1-1.249.594.05.05 0 0 0-.03.03.05.05 0 0 0 .003.041c.24.465.515.909.817 1.329a.05.05 0 0 0 .056.019 13.2 13.2 0 0 0 4.001-2.02.05.05 0 0 0 .021-.037c.334-3.451-.559-6.449-2.366-9.106a.03.03 0 0 0-.02-.019m-8.198 7.307c-.789 0-1.438-.724-1.438-1.612s.637-1.613 1.438-1.613c.807 0 1.45.73 1.438 1.613 0 .888-.637 1.612-1.438 1.612m5.316 0c-.788 0-1.438-.724-1.438-1.612s.637-1.613 1.438-1.613c.807 0 1.451.73 1.438 1.613 0 .888-.631 1.612-1.438 1.612"
            />
          </svg>
        </a>
        <a
          href="https://discord.gg/7gSFp628Sm"
          target="_blank"
          title="Help"
          class="w-8 grid place-items-center text-slate-300 hover:text-slate-400"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-question-circle"
            viewBox="0 0 16 16"
          >
            <path
              d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"
            />
            <path
              d="M5.255 5.786a.237.237 0 0 0 .241.247h.825c.138 0 .248-.113.266-.25.09-.656.54-1.134 1.342-1.134.686 0 1.314.343 1.314 1.168 0 .635-.374.927-.965 1.371-.673.489-1.206 1.06-1.168 1.987l.003.217a.25.25 0 0 0 .25.246h.811a.25.25 0 0 0 .25-.25v-.105c0-.718.273-.927 1.01-1.486.609-.463 1.244-.977 1.244-2.056 0-1.511-1.276-2.241-2.673-2.241-1.267 0-2.655.59-2.75 2.286m1.557 5.763c0 .533.425.927 1.01.927.609 0 1.028-.394 1.028-.927 0-.552-.42-.94-1.029-.94-.584 0-1.009.388-1.009.94"
            />
          </svg>
        </a>
        <div class="w-2"></div>
        <button
          onclick="mida.minimize()"
          class="w-11 grid place-items-center text-slate-300 hover:text-slate-400"
        >
          <svg
            class="block w-3 h-3"
            viewBox="0 0 12 12"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M2 6h8" />
          </svg>
        </button>
        <button
          id="maximize"
          onclick="mida.maximize()"
          class="w-11 grid place-items-center text-slate-300 hover:text-slate-400"
        >
          <svg
            class="block w-3 h-3 overflow-visible"
            viewBox="0 0 12 12"
            stroke="currentColor"
            stroke-width="2"
            fill="none"
          >
            <path class="back-square" d="M5 -0.5H12.5V7" stroke-width="1.5" />
            <rect x="2" y="2" width="8" height="8" rx="1" />
          </svg>
        </button>
        <button
          onclick="mida.close()"
          class="w-11 grid place-items-center text-slate-300 hover:text-slate-400"
        >
          <svg
            class="block w-3 h-3"
            viewBox="0 0 12 12"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          >
            <path d="M2 2l8 8M10 2l-8 8" />
          </svg>
        </button>
      </div>
    </header>

    <aside
      id="menu"
      class="flex flex-col flex-1 min-h-0 overflow-y-auto border-secondary"
    >
      <nav id="tools" class="flex flex-col gap-2 flex-1 py-2"></nav>
      <div class="sticky bottom-0 bg-secondary flex flex-col">
        <button
          id="auth"
          class="m-4 py-3 px-4 text-white hover:text-slate-200 border border-accent-text bg-accent text-center text-shadow-lg hover:cursor-pointer hover-frame"
        >
          Sign In
        </button>
      </div>
    </aside>

    <script src="index.js"></script>
  </body>
</html>
